<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLB Web - Quản lý Hoạt động</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 60px;
      background-color: #f0f2f5;
      margin: 0;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      display: inline-block;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      min-width: 360px;
    }
    h1 {
      color: #1a73e8;
      font-size: 24px;
      margin-bottom: 20px;
    }
    .status-box {
      margin: 15px 0;
      padding: 12px;
      border-radius: 8px;
      text-align: left;
      background-color: #fafafa;
      border: 1px solid #e0e0e0;
    }
    .status-label {
      font-size: 14px;
      color: #666;
      margin-bottom: 4px;
    }
    .status-value {
      font-size: 18px;
      font-weight: bold;
    }
    .ok { color: #2e7d32; }
    .error { color: #d32f2f; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hệ thống CLB Web</h1>

    <div class="status-box">
      <div class="status-label">Trạng thái Server:</div>
      <div id="server-status" class="status-value">Đang kiểm tra...</div>
    </div>

    <div class="status-box">
      <div class="status-label">Trạng thái Cơ sở dữ liệu (Database):</div>
      <div id="db-status" class="status-value">Đang kiểm tra...</div>
      <div id="db-detail" style="font-size: 12px; color: #888; margin-top: 4px;"></div>
    </div>
  </div>

  <script>
    fetch('/api/health')
      .then(response => response.json())
      .then(data => {
        // Hiển thị trạng thái server
        const serverEl = document.getElementById('server-status');
        serverEl.innerText = `Server: ${data.server}`;
        serverEl.className = 'status-value ok';

        // Hiển thị trạng thái database
        const dbEl = document.getElementById('db-status');
        const dbDetail = document.getElementById('db-detail');

        if (data.database.status === 'ok') {
          dbEl.innerText = 'Database: Đã kết nối thành công';
          dbEl.className = 'status-value ok';
          dbDetail.innerText = data.database.message;
        } else {
          dbEl.innerText = 'Database: Lỗi kết nối!';
          dbEl.className = 'status-value error';
          dbDetail.innerText = data.database.message;
        }
      })
      .catch(error => {
        document.getElementById('server-status').innerText = 'Không thể kết nối đến server';
        document.getElementById('server-status').className = 'status-value error';
      });
  </script>
</body>
</html>
