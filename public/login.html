<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - CLB Web</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <a href="/">Hệ thống CLB Web</a>
  </header>

  <main>
    <div class="form-card" style="max-width: 440px; margin-top: 2rem;">
      <h2 style="text-align: center;">Đăng nhập Tài khoản</h2>
      <div id="msg"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Địa chỉ Email</label>
          <input type="email" id="email" name="email" required placeholder="nhap-email@clb.test" value="admin@clb.test">
        </div>

        <div class="form-group">
          <label for="password">Mật khẩu</label>
          <input type="password" id="password" name="password" required placeholder="••••••••" value="123456">
        </div>

        <div style="background: #eef3f8; padding: 0.8rem; border-radius: var(--radius); margin-bottom: 1rem; font-size: 0.85rem; color: #444;">
          <strong>Tài khoản thử nghiệm Tuần 5:</strong>
          <br>• Quản trị viên: <code>admin@clb.test</code> | MK: <code>123456</code>
          <br>• Thành viên 1: <code>member1@clb.test</code> | MK: <code>123456</code>
          <br>• Thành viên 2: <code>member2@clb.test</code> | MK: <code>123456</code>
        </div>

        <button type="submit" id="submit-btn" class="btn" style="width: 100%;">Đăng nhập</button>
      </form>
    </div>
  </main>

  <script type="module" src="/js/login.js"></script>
</body>
</html>
