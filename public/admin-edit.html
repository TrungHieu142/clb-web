<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biểu mẫu Hoạt động - Quản trị</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <a href="/">Hoạt động</a>
    <a href="/admin.html" id="nav-admin" style="color: var(--color-danger);">Quản trị</a>
    <a href="/login.html">Đăng nhập</a>
  </header>

  <main>
    <p><a href="/admin.html" style="color: var(--color-primary); text-decoration: none;">← Quay lại danh sách quản trị</a></p>

    <div class="form-card">
      <h2 id="form-heading">Tạo hoạt động mới</h2>
      <div id="form-msg"></div>

      <form id="activity-form">
        <div class="form-group">
          <label for="title">Tên hoạt động *</label>
          <input type="text" id="title" name="title" required minlength="3" maxlength="200" placeholder="Nhập tên hoạt động...">
        </div>

        <div class="form-group">
          <label for="description">Mô tả chi tiết</label>
          <textarea id="description" name="description" rows="4" placeholder="Nội dung, mục đích hoạt động..."></textarea>
        </div>

        <div class="form-group">
          <label for="location">Địa điểm tổ chức</label>
          <input type="text" id="location" name="location" placeholder="Ví dụ: Hội trường B, Phòng Lab 1...">
        </div>

        <div class="form-group">
          <label for="start_at">Thời gian bắt đầu *</label>
          <input type="datetime-local" id="start_at" name="start_at" required>
        </div>

        <div class="form-group">
          <label for="end_at">Thời gian kết thúc *</label>
          <input type="datetime-local" id="end_at" name="end_at" required>
        </div>

        <div class="form-group">
          <label for="capacity">Sức chứa tối đa (người) *</label>
          <input type="number" id="capacity" name="capacity" min="1" max="10000" required value="30">
        </div>

        <div class="form-actions">
          <button type="submit" id="save-btn" class="btn">Lưu hoạt động</button>
          <a href="/admin.html" class="btn btn--secondary">Huỷ bỏ</a>
        </div>
      </form>
    </div>
  </main>

  <script type="module" src="/js/admin-edit.js"></script>
</body>
</html>
